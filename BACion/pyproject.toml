[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "BACion"
version = "1.0.0"
description = "BACion: Prediction of the Optimal NaCl Concentration for Bacterial Growth"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "Bisal Zindal" }
]

keywords = [
    "bacteria",
    "NaCl",
    "salt",
    "growth",
    "proteome",
    "machine learning",
    "XGBoost",
    "bioinformatics"
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "xgboost>=2.0",
    "biopython>=1.80"
]

[project.urls]
Homepage = "https://github.com/bisalzindal-blip/BACion"
Repository = "https://github.com/bisalzindal-blip/BACion"
Issues = "https://github.com/bisalzindal-blip/BACion/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]